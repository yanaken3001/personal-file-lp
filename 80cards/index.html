    /* === 相性スキャンセクション === */
    .lp-compat-clean {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 52px;
      position: relative;
      z-index: 2;
    }
    .lp-compat-card-clean {
      background: #ffffff;
      border-radius: 28px;
      padding: 48px 36px 44px;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.6) inset,
        0 30px 80px -20px rgba(91,60,240,0.18),
        0 0 0 1px rgba(0,0,0,0.04);
      position: relative;
      overflow: hidden;
    }
    .lp-compat-card-clean::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(91,60,240,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91,60,240,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
    }
    .lp-compat-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3em;
      color: var(--ink3);
      text-transform: uppercase;
      margin-bottom: 12px;
      position: relative;
    }
    .lp-compat-title-clean {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 36px;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 12px;
      position: relative;
    }
    .lp-compat-title-grad {
      background: linear-gradient(120deg, #5b3cf0, #f0683c);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .lp-compat-sub-clean {
      font-size: 14px;
      line-height: 1.7;
      color: var(--ink2);
      max-width: 540px;
      margin-bottom: 24px;
      position: relative;
    }
    .lp-compat-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin: 24px auto 0;
      max-width: 880px;
      position: relative;
    }
    .lp-compat-card-wrap {
      position: relative;
      transition: transform 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    .lp-compat-card-wrap.left { animation: lpCompatFloatA 4.8s ease-in-out infinite; }
    .lp-compat-card-wrap.right { animation: lpCompatFloatB 4.8s ease-in-out infinite; }
    /* カード入れ替えフェード（key 変更で再マウント時に再生） */
    .lp-compat-card-swap {
      animation: lpCompatCardFade 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
    }
    @keyframes lpCompatCardFade {
      0% { opacity: 0; transform: scale(0.92) rotateY(15deg); filter: blur(4px); }
      60% { opacity: 1; filter: blur(0); }
      100% { opacity: 1; transform: scale(1) rotateY(0); filter: blur(0); }
    }
    /* ラベル・トーン入れ替えフェード */
    .lp-compat-fade-swap {
      animation: lpCompatTextFade 0.5s ease-out both;
    }
    @keyframes lpCompatTextFade {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes lpCompatFloatA {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(-2deg); }
    }
    @keyframes lpCompatFloatB {
      0%, 100% { transform: translateY(-6px) rotate(2deg); }
      50% { transform: translateY(2px) rotate(2deg); }
    }
    .lp-compat-line {
      flex: 1;
      height: 2px;
      position: relative;
      margin: 0 -10px;
      z-index: 0;
      overflow: visible;
    }
    .lp-compat-line-bg {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, var(--type-a) 0%, #5b3cf0 100%);
      border-radius: 2px;
      opacity: 0.3;
    }
    .lp-compat-line.right .lp-compat-line-bg {
      background: linear-gradient(90deg, #5b3cf0 0%, var(--type-d) 100%);
    }
    .lp-compat-scanner {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 60px;
      height: 4px;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      box-shadow: 0 0 16px rgba(91,60,240,0.8), 0 0 6px rgba(91,60,240,1);
      animation: lpCompatScanLeft 2.8s cubic-bezier(0.4,0,0.6,1) infinite;
      left: 0;
    }
    .lp-compat-line.right .lp-compat-scanner {
      animation-name: lpCompatScanRight;
      animation-delay: 0.7s;
      left: auto;
      right: 0;
    }
    @keyframes lpCompatScanLeft {
      0% { left: 0; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { left: calc(100% - 60px); opacity: 0; }
    }
    @keyframes lpCompatScanRight {
      0% { right: 0; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { right: calc(100% - 60px); opacity: 0; }
    }
    .lp-compat-score {
      width: 212px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-shrink: 0;
      z-index: 5;
      position: relative;
      box-shadow:
        0 0 0 1px rgba(91,60,240,0.18),
        0 12px 40px -8px rgba(91,60,240,0.3);
      animation: lpCompatScorePulse 3.6s ease-in-out infinite;
    }
    @keyframes lpCompatScorePulse {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(91,60,240,0.18),
          0 12px 40px -8px rgba(91,60,240,0.3),
          0 0 0 0 rgba(91,60,240,0);
      }
      50% {
        box-shadow:
          0 0 0 1px rgba(91,60,240,0.3),
          0 12px 50px -8px rgba(91,60,240,0.45),
          0 0 0 6px rgba(91,60,240,0.04);
      }
    }
    .lp-compat-score-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: conic-gradient(from 0deg,
        transparent 0deg,
        var(--type-a) 80deg,
        transparent 130deg,
        transparent 230deg,
        var(--type-d) 310deg,
        transparent 360deg);
      opacity: 0.55;
      animation: lpCompatRingSpin 6s linear infinite;
      z-index: -1;
      -webkit-mask: radial-gradient(circle, transparent 50%, #000 51%, #000 56%, transparent 57%);
      mask: radial-gradient(circle, transparent 50%, #000 51%, #000 56%, transparent 57%);
      pointer-events: none;
    }
    @keyframes lpCompatRingSpin {
      to { transform: rotate(360deg); }
    }
    .lp-compat-ripple {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(91,60,240,0.4);
      animation: lpCompatRipple 2.4s ease-out infinite;
      z-index: -1;
      pointer-events: none;
    }
    .lp-compat-ripple.r2 { animation-delay: 1.2s; }
    @keyframes lpCompatRipple {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    .lp-compat-score-eyebrow {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: var(--ink3);
      text-transform: uppercase;
      margin-bottom: 4px;
      animation: lpCompatBlink 2s ease-in-out infinite;
    }
    @keyframes lpCompatBlink {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .lp-compat-score-num {
      font-family: 'Inter', sans-serif;
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(120deg, #5b3cf0, #f0683c);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
      letter-spacing: -0.03em;
    }
    .lp-compat-score-num small {
      font-size: 32px;
      font-weight: 700;
    }
    .lp-compat-score-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: 0.04em;
      background: rgba(91,60,240,0.08);
      border: 1px solid rgba(91,60,240,0.2);
      padding: 4px 12px;
      border-radius: 100px;
    }
    .lp-compat-particles {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 1;
    }
    .lp-compat-particle {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--type-a), var(--type-d));
      animation: lpCompatParticleFloat 4s ease-in-out infinite;
      opacity: 0;
    }
    @keyframes lpCompatParticleFloat {
      0% { transform: translate(0, 0) scale(0); opacity: 0; }
      20% { opacity: 0.8; }
      50% { opacity: 1; }
      80% { opacity: 0.6; }
      100% { transform: translate(var(--px,30px), var(--py,-30px)) scale(0); opacity: 0; }
    }
    .lp-compat-tone {
      text-align: center;
      margin-top: 24px;
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 500;
      color: var(--ink2);
      line-height: 1.7;
      position: relative;
    }
    .lp-compat-cta-wrap {
      text-align: center;
      margin-top: 20px;
      position: relative;
    }
    .lp-compat-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border-radius: 100px;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
    }
    .lp-compat-cta:hover { transform: translateY(-2px); opacity: 0.9; }

    /* モバイル: スキャンライン非表示・縦並び */
    @media (max-width: 768px) {
      .lp-compat-clean { padding: 0 16px 40px; }
      .lp-compat-card-clean { padding: 32px 18px 34px; border-radius: 24px; }
      .lp-compat-title-clean { font-size: 26px; }
      .lp-compat-sub-clean { margin-bottom: 22px; }
      .lp-compat-row {
        flex-direction: column;
        gap: 14px;
        max-width: 280px;
        margin-top: 18px;
      }
