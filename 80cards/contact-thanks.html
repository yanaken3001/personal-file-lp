  <style>
    :root {
      --ink: #1c1b22;
      --ink-2: #4b4954;

      --line: rgba(34, 31, 42, 0.12);
      --paper: #fffdfb;

      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;

    * {

    body {

      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;

      padding: 34px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);

      width: 168px;
      height: auto;
      display: block;

      font-size: 11px;

      letter-spacing: 0.22em;

      font-size: 32px;
      line-height: 1.35;
      font-weight: 900;

      font-size: 16px;

      padding: 18px;

    .result-box.is-visible {
      display: grid;
      gap: 8px;

    .result-box span {
      color: var(--ink-3);

      font-size: 20px;

    }

        #fff;

    .booking-kicker {
      margin: 0 0 10px;

<body>
  <main class="done-card">
    <img class="logo" src="logo/80cards-logo-full-new2.png?v=20260606c" alt="80CARDS" width="1850" height="431" />
    <p class="done-kicker">PERSONAL FILE</p>
    <h1>登録が完了しました</h1>
    <p class="lead">
      ご入力いただいた内容を受け付けました。<br />
      担当者が内容を確認し、<br />
      パーソナルファイルよりご連絡いたします。
    </p>

    <div class="result-box" id="resultBox">
      <span>引き継いだ診断結果</span>
      <strong id="resultText"></strong>
    </div>

    <section class="booking-box" aria-labelledby="bookingTitle">
      <p class="booking-kicker">NEXT STEP</p>
      <h2 class="booking-title" id="bookingTitle">続いて、面談日程を選んでください</h2>
      <p class="booking-text">
        以下のボタンより、ご都合のよろしい面談日程を選択できます。
        登録いただいたお名前・メールアドレス・電話番号は、予約ページに入力済みで引き継ぎます。
      </p>
      <a class="btn btn-primary btn-schedule" id="scheduleButton" href="https://www.jicoo.com/t/Jmsc3paGAwS1/e/80cards">
        面談日程を選ぶ
      </a>
      <p class="booking-note">
        面談はGoogle Meetをつかったオンライン面談となります。
      </p>
    </section>

    <div class="actions">
      <a class="btn btn-primary" href="index.html">80CARDSへ戻る</a>
      <a class="btn btn-secondary" href="../">PERSONAL FILEトップへ</a>
    </div>
  </main>

  <script>
    const submission = (() => {
      try {
        const raw = window.sessionStorage.getItem('pf80cardsSubmission');
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        return null;
      }
    })();

    function getQueryParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function getMarketingParams() {
      const params = new URLSearchParams(window.location.search);
      return ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'utm_id', 'gclid', 'fbclid'].reduce((carry, key) => {
        const value = params.get(key);
        if (value) carry[key] = value;
        return carry;
      }, {});
    }

    function getLeadEventParams() {
      const context = submission?.resultContext || {};
      const params = {
        content_name: '80cards_contact_complete',
        route: getQueryParam('route') || submission?.route || '80cards_result',
        source: getQueryParam('source') || submission?.source || '80cards',
        cta: getQueryParam('cta') || submission?.cta || '80cards_contact',
        ...getMarketingParams(),
      };
      const userId = getQueryParam('user_id') || submission?.userId;
      if (userId) params.user_id = userId;
      if (context.typeCode) params.full_type = context.typeCode;
      if (context.type16Code) params.personality_type = context.type16Code;
      if (context.behaviorType) params.behavioral_type = context.behaviorType;
      return params;
    }

    function buildJicooBookingUrl() {
      const url = new URL('https://www.jicoo.com/t/Jmsc3paGAwS1/e/80cards');
      const contact = submission?.contact || {};
      const name = String(contact.name || '').trim();
      const email = String(contact.email || '').trim();
      const tel = String(contact.tel || '').replace(/[^\d+]/g, '');

      url.searchParams.set('location', 'googleMeet');
      url.searchParams.set('timezone', 'Asia/Tokyo');
      if (name) url.searchParams.set('name', name);
      if (email) url.searchParams.set('email', email);
      if (tel) url.searchParams.set('携帯番号（お電話がつながる番号をご記入ください）', tel);

      return url.toString();
    }

    function trackScheduleClick() {
      const eventParams = getLeadEventParams();
      try {
        if (typeof gtag === 'function') {
          gtag('event', 'select_schedule', {
            form_name: '80cards_contact',
            destination: 'jicoo',
            ...eventParams,
          });
        }
      } catch (error) {}
    }

    function trackLeadComplete() {
      const eventId = getQueryParam('event_id') || submission?.leadEventId || '';
      const userId = getQueryParam('user_id') || submission?.userId || '';
      if (!eventId && !userId && !submission?.submittedAt) return;
      const dedupeKey = 'pf80cardsLeadTracked:' + (eventId || userId || window.location.pathname);
      try {
        if (window.sessionStorage.getItem(dedupeKey)) return;
        window.sessionStorage.setItem(dedupeKey, '1');
      } catch (error) {}

      const eventParams = getLeadEventParams();
      try {
        if (typeof fbq === 'function') {
          if (eventId) {
            fbq('track', 'Lead', eventParams, { eventID: eventId });
          } else {
            fbq('track', 'Lead', eventParams);
          }
        }
        if (typeof gtag === 'function') {
          gtag('event', 'generate_lead', {
            form_name: '80cards_contact',
            ...eventParams,
          });
        }
      } catch (error) {}
    }

    const context = submission?.resultContext;
    if (context?.typeCode || context?.typeName) {
      const resultBox = document.getElementById('resultBox');
      const resultText = document.getElementById('resultText');
      resultText.textContent = [context.typeCode, context.typeName].filter(Boolean).join(' / ');
      resultBox.classList.add('is-visible');
    }

    const scheduleButton = document.getElementById('scheduleButton');
    if (scheduleButton) {
      scheduleButton.href = buildJicooBookingUrl();
      scheduleButton.addEventListener('click', trackScheduleClick);
    }

    trackLeadComplete();
  </script>
</body>
